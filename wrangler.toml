name = "anbar-mgas"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "anbar.mgas.ir", custom_domain = true }
]

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "anbar-db1"
database_id = "c2fc96f5-9019-42be-802d-67d1b40d5cf1"

[vars]
NODE_VERSION = "22"
